        for (let k = 1; k < n; k++) { ctx.strokeStyle = rgba(COL.light, (kept.has(c.k) ? .45 : .3 * (1 - judge)) + .45 * (1 - fuse)); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 6 + k * 5 + 8 * (1 - fuse), 0, TAU); ctx.stroke(); }
        if (fuse < 1) orb(x, y, 40, COL.lightHi, .6 * (1 - fuse));
      }
      if (kept.has(c.k)) { const b = .55 + .45 * judge; orb(x, y, 14 + 10 * judge + 4 * n, COL.light, .5 * b * (1 - .4 * settle)); pt(x, y, 2 + .7 * n, COL.lightHi, b); }
      else {
        if (judge > 0 && !spawned.has(`c${ri}:${c.k}`)) { spawned.add(`c${ri}:${c.k}`); spawn(x, y, 9, `c${ri}${c.k}`, x, y - 30, 1, COL.light, COL.goldAsh); }
        pt(x, y, 2, COL.light, .8 * (1 - judge));
      }
    });
    if (grow >= 1) fusedTotal += r.merged;
    if (judge > 0) burnedTotal += r.cands.length - kept.size + r.edges.filter(e => e[1] === "x").length;
    if (lt >= 0) alive = r.cands.length ? (judge > 0 ? kept.size : r.edges.length) : r.live.length;
    if (r.goal && grow >= 1 && solveT === null) solveT = IS_T0 + LEAD2 + ri * RD + 1.25;
  });
  if (solved) {
    const k = clamp((t - solveT) / .6), g = toBox(box, G.goal);
    // the winning line, blazing from the seed to the answer
    const nodes = [root, ...G.path.slice(1).map((key, i) => toBox(box, G.pos[i + 1][key])), g];
    for (let i = 0; i < nodes.length - 1; i++) strokeThread(nodes[i], nodes[i + 1], 0, 1, hash("win" + i), COL.lightHi, .7 * k, k, 3);
    orb(g[0], g[1], 120 + 12 * Math.sin(t * 6), COL.light, .75 * k); pt(g[0], g[1], 6, COL.lightHi, k);
    if (!spawned.has("solve")) { spawned.add("solve"); spawn(g[0], g[1], 70, "solve", g[0], g[1] - 40, 1.8, COL.lightHi, COL.light); }
  }
  // counters, mirroring the LLM side
  const by = box.y1 + (wide ? 60 : 38);
  const steps = solved ? nR : Math.min(nR, Math.max(lt0 >= LEAD2 ? 1 : 0, Math.floor((lt0 - LEAD2) / RD) + 1));
  label(`${steps}`, box.x0, by, { size: wide ? 56 : 34, c: COL.ink, font: SERIF });
  label(steps === 1 ? "step, every line moving at once" : "steps, every line moving at once", box.x0 + (wide ? 44 : 28), by - (wide ? 8 : 6), { size: wide ? 13 : 11, c: COL.dim });
  let line = "", lc = COL.light;
  const ri = Math.floor((lt0 - LEAD2) / RD), lt = (lt0 - LEAD2) - ri * RD, r = p.rounds[Math.min(Math.max(ri, 0), nR - 1)];
  if (lt0 >= LEAD2 && !solved) {
    if (lt < 1.25) line = `branching · ${r.edges.length} lines at once`;
    else if (lt < 1.65) line = r.merged ? `merging · ${r.merged} lines meet and fuse` : "branching";
    else if (lt < 2.2) line = `cancelling · ${r.cands.length - r.cands.filter(c => c.kept).length + r.edges.filter(e => e[1] === "x").length} dead ends burn out`;
    else line = `advancing · ${r.cands.filter(c => c.kept).length} survivors, together`;
  }
  if (solved) { line = `solved: ${nice(p.solution)} = ${p.target}`; lc = COL.lightHi; }
  label(line, box.x0, by + (wide ? 34 : 24), { size: wide ? 16 : 12, c: lc, weight: 500 });
  label(`${alive} lines alive · ${fusedTotal} fused · ${burnedTotal} burned out`, box.x0, by + (wide ? 58 : 42), { size: wide ? 13 : 11, c: COL.dim });
  return { solved, solveT };
}

// ---------- title and end cards ----------
const TITLE = 2.2;
function drawTitle(t, p) {
  const a = clamp(t / .5) * (1 - clamp((t - 1.6) / .6));
  label("Same problem. Two ways to think.", W / 2, H * .46, { size: Math.min(64, W * .045), c: COL.ink, a, font: SERIF, align: "center" });
  label(`reach ${p.target} from ${p.numbers.join(", ")} · each number once · + − × ÷`, W / 2, H * .46 + 48, { size: Math.min(18, W * .016), c: COL.dim, a, align: "center" });
}
function drawEnd(k, cot, p, wide) {
  overlayK = .86 * k;
  const a = clamp(k * 1.4);
  const sz = Math.min(54, W * .038);
  label(cot.solved ? `LLM in text: ${cot.tokens.toLocaleString()} tokens, one line.` : `LLM in text: found it, never finished.`, W / 2, H * .42, { size: sz, c: COL.amberHi, a, font: SERIF, align: "center" });
  label(`Interference Search: ${p.rounds.length} steps.`, W / 2, H * .42 + sz * 1.25, { size: sz, c: COL.lightHi, a, font: SERIF, align: "center" });
  label("stop thinking in a line", W / 2, H * .42 + sz * 2.6, { size: Math.min(16, W * .014), c: COL.dim, a, align: "center", ls: 4 });
  label("right: environment lists moves, a small trained judge ranks positions · left: Qwen3-1.7B with thinking, 2,048-token budget", W / 2, H - 30,
    { size: Math.min(12, W * .011), c: COL.dim, a: a * .8, align: "center" });
}

// ---------- timeline ----------
let idx = 0, t = 0, playing = true;
function problems() { return DATA.showcase.map((p, i) => ({ p, cot: DATA.cot[i], G: buildIS(p) })); }
const PROBS = problems();
function sceneLen(s) { return TITLE + Math.max(LLM_T0 + s.cot.tokens / TOK_RATE, 12) + 1.4 + 3.8; }
function reset(i) { idx = i % PROBS.length; t = 0; embers = []; spawned = new Set(); shocks = []; }

function background() {
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = rgba(COL.bg, .32); ctx.fillRect(0, 0, W, H);
}
function frame(dt) {
  const S = PROBS[idx], wide = layout().wide, Lb = layout();
  background();
  spin += dt * .02;
  const len = sceneLen(S), endStart = len - 3.8;
  if (t < TITLE) drawTitle(t, S.p);
  const tt = t - TITLE;
  if (tt >= 0) {
    drawLLM(Lb.L, S.cot, tt, wide);
    drawIS(Lb.R, S.p, S.G, tt, wide);
    if (wide) { ctx.globalCompositeOperation = "source-over"; ctx.strokeStyle = rgba(COL.dim, .12); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(W * .485, H * .1); ctx.lineTo(W * .485, H * .92); ctx.stroke(); }
  }
  stepEmbers(dt);
  overlayK = 0;
  if (t > endStart) { const k = clamp((t - endStart) / 1); if (k > .5) LABELS = []; drawEnd(k, S.cot, S.p, wide); }
  mctx.globalCompositeOperation = "source-over";
  mctx.fillStyle = rgba(COL.bg, 1); mctx.fillRect(0, 0, W, H);
  mctx.drawImage(fx, 0, 0, W, H);
  if (overlayK > 0) { mctx.fillStyle = rgba(COL.bg, overlayK); mctx.fillRect(0, 0, W, H); }
  flushLabels();
}

// ---------- live playback, or frame-exact rendering for the video ----------
if (RENDER) {
  (async () => {
    await document.fonts.ready;
    const fps = 30, which = +(new URLSearchParams(location.search).get("p") || 0);
    reset(which); ctx.fillStyle = rgba(COL.bg, 1); ctx.fillRect(0, 0, W, H); mctx.fillStyle = rgba(COL.bg, 1); mctx.fillRect(0, 0, W, H);
    const n = Math.ceil(sceneLen(PROBS[which]) * fps);
    for (let i = 0; i < n; i++) {
      t = i / fps; frame(1 / fps);
      const blob = await new Promise(r => cv.toBlob(r, "image/png"));
      await fetch(`/frame?i=${i}`, { method: "POST", body: blob });
    }
    await fetch("/done", { method: "POST" });
  })();
} else {
  let prev = performance.now();
  reset(0); ctx.fillStyle = rgba(COL.bg, 1); ctx.fillRect(0, 0, W, H);
  const loop = now => {
    const dt = Math.min(.05, (now - prev) / 1000); prev = now;
    if (playing) { t += dt; frame(dt); if (t >= sceneLen(PROBS[idx])) reset(idx + 1); }
    requestAnimationFrame(loop);
  };
  cv.addEventListener("click", () => { playing = !playing; prev = performance.now(); });
  addEventListener("keydown", e => { if (e.key === " ") { playing = !playing; prev = performance.now(); e.preventDefault(); } if (e.key === "ArrowRight") reset(idx + 1); });
  requestAnimationFrame(loop);
}
</script>
